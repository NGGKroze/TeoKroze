            const dispQty = (s.qty !== undefined && s.qty !== null && String(s.qty) !== '') ? escapeHtml(s.qty) : blankCell;
            tableRowsHtml += `<tr><td>${dispColor}</td><td>${dispArticle}</td><td>${dispSize}</td><td>${dispQty}</td></tr>`;
          }

          const parcelFor = escapeHtml(compactAddressForLabel(meta.destinationAddress, FRANCE_GXO_ADDRESS)).replace(/\n/g, '<br>');
          const supplier = escapeHtml(compactAddressForLabel(meta.supplierAddress, 'PELINTEX BULGARIA\n5 HRISTO BOTEV,\n7000 RUSE, BULGARIA')).replace(/\n/g, '<br>');
          const po = escapeHtml(meta.orderNo || '');
          const commessa = escapeHtml(meta.commessaNo || '');
          pageDiv.innerHTML += `
            <div class="label-wrapper">
              <div class="section pap-row">${escapeHtml(meta.pap || 'PAP F')}</div>
              <div class="section address-row">
                <div class="addr-col"><u><b>PARCEL FOR:</b></u><br>${parcelFor}</div>
                <div class="addr-col"><u><b>SUPPLIER NAME:</b></u><br>${supplier}</div>
              </div>
              <div class="section po-row">
                <div class="po-col">PO: ${po}</div>
                <div class="po-col">COMMESA: ${commessa}</div>
              </div>
              <div class="section table-section">
                <table class="items-table"><colgroup><col style="width:26%;"><col style="width:29%;"><col style="width:18%;"><col style="width:27%;"></colgroup>
                  <thead><tr><th>COLOR</th><th>CODE ARTICLE</th><th>SIZE</th><th>TOTAL QTY</th></tr></thead>
                  <tbody>${tableRowsHtml}
                    <tr class="footer-row-tr total-row-tr">
                      <td style="text-align:left; padding-left: 8px;">TOTAL</td>
                      <td style="text-align:right; padding-right:15px;">${escapeHtml(data.totalQty)}</td>
                      <td style="text-align:left; padding-left: 8px;">PIECES</td>
                      <td></td>
                    </tr>
                    <tr class="footer-row-tr carton-row-tr">
                      <td class="carton-label" style="text-align:left; padding-left: 8px;">CARTON NUMBER</td>
                      <td class="carton-value" style="text-align:right; padding-right:15px;">${escapeHtml(data.cartonNum)}</td>
                      <td class="carton-of" style="text-align:center;">OF</td>
                      <td class="carton-total" style="text-align:center;">${escapeHtml(data.totalPackages)}</td>
                    </tr>
                    <tr class="footer-row-tr weight-row-tr">
                      <td class="weight-net-label" style="text-align:left; padding-left: 8px;">NETT WEIGHT KG</td>
                      <td class="weight-net-value" style="text-align:right; padding-right:15px;">${formatWeight(data.netWt)}</td>
                      <td class="weight-gross-label" style="text-align:left; padding-left: 8px; white-space:nowrap;">GROSS WEIGHT KG</td>
                      <td class="weight-gross-value" style="text-align:right; padding-right:8px;">${formatWeight(data.grossWt)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;
          labelIdx++;
        }
        pagesContainer.appendChild(pageDiv);
      }
    }

    function downloadPackingListXlsx() {
      if (!activePackingRows.length || !activeJob) {
        alert('No packing list data generated yet.');
        return;
      }
      const meta = getControlsMeta();
      const wb = XLSX.utils.book_new();
      const ws = buildPackingListWorksheet(activePackingRows, activeSizeColumns, meta);
      XLSX.utils.book_append_sheet(wb, ws, 'Packing List');
      const fileName = safeFileName(`Packing list ${meta.orderNo || activeJob.orderNo || 'Dior'} Commessa ${meta.commessaNo || activeJob.commessaNo || ''}.xlsx`);
      XLSX.writeFile(wb, fileName, { bookType: 'xlsx', compression: true });
    }

    function buildPackingListWorksheet(rows, sizeColumns, meta) {
      const sizeCount = sizeColumns.length;
      const qtyCtnCol = 6 + sizeCount;
      const ttlCtnCol = qtyCtnCol + 1;
      const netCol = qtyCtnCol + 2;
      const grossCol = qtyCtnCol + 3;
      const ttlNetCol = qtyCtnCol + 4;
      const ttlGrossCol = qtyCtnCol + 5;
      const ttlQtyCol = qtyCtnCol + 6;
      const lastCol = ttlQtyCol;
      const headerRow = 8;
      const firstDataRow = headerRow + 1;
      const totalRow = firstDataRow + rows.length;

      const leftValueEnd = Math.max(5, Math.min(9, lastCol - 6));
      const leftLabelEnd = Math.min(2, leftValueEnd - 1);
      const leftValueStart = leftLabelEnd + 1;
      const rightStart = Math.max(leftValueEnd + 1, lastCol - 5);
      const rightLabelEnd = Math.min(rightStart + 2, lastCol - 3);
      const rightValueStart = Math.min(rightLabelEnd + 1, lastCol - 2);
      const rightValueEnd = Math.max(rightValueStart, lastCol - 1);
      const unitCol = lastCol;

      const aoa = [];
      for (let r = 0; r < totalRow + 3; r++) aoa[r] = Array(lastCol + 1).fill('');

      const cartonSpec = normalizeCartonSpec(meta.cartonType || '60/40/15');
      const invoiceText = meta.invoiceNumber || `          / ${formatDateDots(new Date())}`;

      aoa[0][0] = `PACKING LIST № ${meta.plNumber || ''}`;

      aoa[1][0] = `department ${meta.pap === 'PAP H' ? 'PAP-H' : 'PAP-F'} uniform order`;
      aoa[1][rightStart] = 'N Weight:';
      aoa[1][rightValueStart] = { f: `${colLetter(ttlNetCol + 1)}${totalRow + 1}`, v: sumRows(rows, 'ttlNetWt'), t: 'n' };
      aoa[1][unitCol] = 'kg';

      aoa[2][0] = 'Order No.:';
      aoa[2][leftValueStart] = `${meta.orderNo || ''}/ Commessa ${meta.commessaNo || ''}`.trim();
      aoa[2][rightStart] = 'G Weight:';
      aoa[2][rightValueStart] = { f: `${colLetter(ttlGrossCol + 1)}${totalRow + 1}`, v: sumRows(rows, 'ttlGrossWt'), t: 'n' };
      aoa[2][unitCol] = 'kg';

      aoa[3][0] = 'Destination:';
      aoa[3][leftValueStart] = (meta.destinationAddress || '').replace(/\n/g, ', ');
      aoa[3][rightStart] = 'Total Packages:';
      aoa[3][rightValueStart] = { f: `${colLetter(ttlCtnCol + 1)}${totalRow + 1}`, v: sumRows(rows, 'ttlCtns'), t: 'n' };
      aoa[3][unitCol] = 'Cartons';

      aoa[4][0] = 'Invoice number:';
      aoa[4][leftValueStart] = invoiceText;

      aoa[5][0] = 'Total Quantity:';
      aoa[5][leftValueStart] = { f: `${colLetter(ttlQtyCol + 1)}${totalRow + 1}`, v: sumRows(rows, 'totalQty'), t: 'n' };
      aoa[5][leftValueStart + 1] = 'Pcs';

      aoa[6][rightStart] = cartonSpec;
      aoa[7][0] = 'N/M';

      const headers = ['CTN\nNO.', '', '', 'REF NO.', 'DESCRIPTION', 'COLOR', ...sizeColumns, 'QTY\nCTN', 'TTL\nCTNS', 'NET WT', 'GR. WT', 'TTL NET\nWT', 'TTL GR.\nWT', 'TTL QTY'];
      aoa[headerRow] = headers;

      rows.forEach((row, idx) => {
        const r = firstDataRow + idx;
        const excelRow = r + 1;
        aoa[r][0] = row.ctnStart;
        aoa[r][1] = 'to';
        aoa[r][2] = row.ctnEnd;
        aoa[r][3] = row.style;
        aoa[r][4] = row.description;
        aoa[r][5] = row.color;
        sizeColumns.forEach((s, si) => { aoa[r][6 + si] = row.sizes[s] || ''; });
        const sizeRange = `${colLetter(7)}${excelRow}:${colLetter(6 + sizeCount)}${excelRow}`;
        aoa[r][qtyCtnCol] = { f: `IF(SUM(${sizeRange})>0,SUM(${sizeRange}),"")`, v: row.qtyCtn, t: 'n' };
        aoa[r][ttlCtnCol] = { f: `IF(${colLetter(3)}${excelRow}>0,${colLetter(3)}${excelRow}-${colLetter(1)}${excelRow}+1,"")`, v: row.ttlCtns, t: 'n' };
        aoa[r][netCol] = { f: `${colLetter(qtyCtnCol + 1)}${excelRow}*${parseFloat(netKgPieceInput.value || '0')}`, v: row.netWt, t: 'n' };
        aoa[r][grossCol] = { f: `${colLetter(netCol + 1)}${excelRow}+${parseFloat(cartonTareInput.value || '0')}`, v: row.grossWt, t: 'n' };
        aoa[r][ttlNetCol] = { f: `IF(${colLetter(netCol + 1)}${excelRow}>0,${colLetter(ttlCtnCol + 1)}${excelRow}*${colLetter(netCol + 1)}${excelRow},"")`, v: row.ttlNetWt, t: 'n' };
        aoa[r][ttlGrossCol] = { f: `IF(${colLetter(grossCol + 1)}${excelRow}>0,${colLetter(ttlCtnCol + 1)}${excelRow}*${colLetter(grossCol + 1)}${excelRow},"")`, v: row.ttlGrossWt, t: 'n' };
        aoa[r][ttlQtyCol] = { f: `IF(${colLetter(ttlCtnCol + 1)}${excelRow}<>"",${colLetter(ttlCtnCol + 1)}${excelRow}*${colLetter(qtyCtnCol + 1)}${excelRow},"")`, v: row.totalQty, t: 'n' };
      });

      const tr = totalRow;
      const firstExcelDataRow = firstDataRow + 1;
      const lastExcelDataRow = totalRow;
      aoa[tr][0] = 'TOTAL';
      for (let c = 6; c < 6 + sizeCount; c++) {
        const col = colLetter(c + 1);
        const ttlCtnColLetter = colLetter(ttlCtnCol + 1);
        aoa[tr][c] = { f: `SUMPRODUCT(${col}${firstExcelDataRow}:${col}${lastExcelDataRow},$${ttlCtnColLetter}$${firstExcelDataRow}:$${ttlCtnColLetter}$${lastExcelDataRow})`, v: rows.reduce((sum, row) => sum + (row.sizes[sizeColumns[c - 6]] || 0) * row.ttlCtns, 0), t: 'n' };
      }
      aoa[tr][qtyCtnCol] = 'total';
      aoa[tr][ttlCtnCol] = { f: `SUM(${colLetter(ttlCtnCol + 1)}${firstExcelDataRow}:${colLetter(ttlCtnCol + 1)}${lastExcelDataRow})`, v: sumRows(rows, 'ttlCtns'), t: 'n' };
      aoa[tr][ttlNetCol] = { f: `SUMPRODUCT(${colLetter(netCol + 1)}${firstExcelDataRow}:${colLetter(netCol + 1)}${lastExcelDataRow},${colLetter(ttlCtnCol + 1)}${firstExcelDataRow}:${colLetter(ttlCtnCol + 1)}${lastExcelDataRow})`, v: sumRows(rows, 'ttlNetWt'), t: 'n' };
      aoa[tr][ttlGrossCol] = { f: `SUMPRODUCT(${colLetter(ttlCtnCol + 1)}${firstExcelDataRow}:${colLetter(ttlCtnCol + 1)}${lastExcelDataRow},${colLetter(grossCol + 1)}${firstExcelDataRow}:${colLetter(grossCol + 1)}${lastExcelDataRow})`, v: sumRows(rows, 'ttlGrossWt'), t: 'n' };
      aoa[tr][ttlQtyCol] = { f: `SUM(${colLetter(ttlQtyCol + 1)}${firstExcelDataRow}:${colLetter(ttlQtyCol + 1)}${lastExcelDataRow})`, v: sumRows(rows, 'totalQty'), t: 'n' };
      aoa[tr + 2][1] = `1 PL = MAX 40 boxes ${cartonSpec.replace(/^colis\s+/i, '')}`;

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const merges = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: lastCol } },
        { s: { r: 1, c: 0 }, e: { r: 1, c: leftValueEnd } },
        { s: { r: 6, c: rightStart }, e: { r: 6, c: lastCol } },
        { s: { r: 7, c: 0 }, e: { r: 7, c: Math.min(2, lastCol) } },
        { s: { r: tr + 2, c: 1 }, e: { r: tr + 2, c: Math.min(10, lastCol) } }
      ];
      for (let r = 2; r <= 5; r++) {
        merges.push({ s: { r, c: 0 }, e: { r, c: leftLabelEnd } });
      }
      for (let r = 2; r <= 4; r++) {
        merges.push({ s: { r, c: leftValueStart }, e: { r, c: leftValueEnd } });
      }
      for (let r = 1; r <= 3; r++) {
        merges.push({ s: { r, c: rightStart }, e: { r, c: rightLabelEnd } });
        if (rightValueStart < unitCol) merges.push({ s: { r, c: rightValueStart }, e: { r, c: rightValueEnd } });
      }
      ws['!merges'] = merges;
      ws['!cols'] = buildColumnWidths(sizeCount);
      ws['!rows'] = buildRowHeights(totalRow);
      ws['!margins'] = { left: 0.25, right: 0.25, top: 0.25, bottom: 0.25, header: 0.1, footer: 0.1 };
      applyPackingListStyles(ws, totalRow, lastCol, sizeCount, {
        headerRow,
        firstDataRow,
        leftValueEnd,
        leftLabelEnd,
        leftValueStart,
        rightStart,
        rightLabelEnd,
        rightValueStart,
        rightValueEnd,
        unitCol
      });
      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: totalRow + 2, c: lastCol } });
      return ws;
    }

    function applyPackingListStyles(ws, totalRow, lastCol, sizeCount, layout) {
      const borderThin = { style: 'thin', color: { rgb: '000000' } };
      const borderMed = { style: 'medium', color: { rgb: '000000' } };
      const allThin = { top: borderThin, bottom: borderThin, left: borderThin, right: borderThin };
      const whiteFill = { patternType: 'solid', fgColor: { rgb: 'FFFFFF' }, bgColor: { rgb: 'FFFFFF' } };
      const headerStyle = { font: { bold: true, sz: 9 }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: allThin, fill: whiteFill };
      const center = { font: { sz: 10, bold: false }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, fill: whiteFill };
      const qtyCtnCol = 6 + sizeCount;
      const ttlCtnCol = qtyCtnCol + 1;
      const netCol = qtyCtnCol + 2;
      const grossCol = qtyCtnCol + 3;
      const ttlNetCol = qtyCtnCol + 4;
      const ttlGrossCol = qtyCtnCol + 5;
      const ttlQtyCol = qtyCtnCol + 6;
      const weightCols = new Set([netCol, grossCol, ttlNetCol, ttlGrossCol]);

      // Fill the full used area white so the sheet looks clean and no default/black fills appear.
      styleRange(ws, 0, totalRow + 2, 0, lastCol, { fill: whiteFill });

      eachCell(ws, 0, totalRow + 2, 0, lastCol, (cell, r, c) => {
        cell.s = mergeStyle(cell.s || {}, center);
        if (typeof cell.v === 'number') {
          cell.z = weightCols.has(c) ? '0.0' : '0';
        }
      });

      // Top area: clean, no borders, bold like the reference screenshot.
      styleRange(ws, 0, 0, 0, lastCol, { font: { bold: true, sz: 13 }, alignment: { horizontal: 'center', vertical: 'center' } });
      styleRange(ws, 1, 7, 0, lastCol, { font: { bold: true, sz: 10 }, alignment: { vertical: 'center', wrapText: true } });
      styleRange(ws, 1, 5, 0, layout.leftValueEnd, { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
      styleRange(ws, 2, 5, 0, layout.leftLabelEnd, { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
      styleRange(ws, 2, 5, layout.leftValueStart, layout.leftValueEnd, { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
      styleRange(ws, 1, 3, layout.rightStart, layout.rightLabelEnd, { alignment: { horizontal: 'left', vertical: 'center', wrapText: true } });
      styleRange(ws, 1, 3, layout.rightValueStart, layout.rightValueEnd, { alignment: { horizontal: 'right', vertical: 'center', wrapText: true } });
      styleRange(ws, 1, 3, layout.unitCol, layout.unitCol, { alignment: { horizontal: 'left', vertical: 'center', wrapText: true } });
      styleRange(ws, 5, 5, layout.leftValueStart, layout.leftValueStart, { alignment: { horizontal: 'right', vertical: 'center', wrapText: false } });
      styleRange(ws, 5, 5, layout.leftValueStart + 1, layout.leftValueStart + 1, { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
      styleRange(ws, 6, 6, layout.rightStart, lastCol, { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
      styleRange(ws, 7, 7, 0, Math.min(2, lastCol), { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });

      // Matrix table: borders everywhere, but data values stay normal weight.
      styleRange(ws, layout.headerRow, layout.headerRow, 0, lastCol, headerStyle);
      styleRange(ws, layout.firstDataRow, totalRow - 1, 0, lastCol, { font: { bold: false, sz: 10 }, border: allThin, alignment: { horizontal: 'center', vertical: 'center', wrapText: true } });
      styleRange(ws, layout.firstDataRow, totalRow - 1, 3, 5, { font: { bold: false, sz: 10 }, alignment: { horizontal: 'left', vertical: 'center', wrapText: true } });
      styleRange(ws, layout.firstDataRow, totalRow - 1, 0, 2, { font: { bold: false, sz: 10 }, alignment: { horizontal: 'center', vertical: 'center', wrapText: false } });
      styleRange(ws, totalRow, totalRow, 0, lastCol, { font: { bold: true, sz: 10 }, border: { top: borderMed, bottom: borderMed, left: borderThin, right: borderThin }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true } });
      styleRange(ws, totalRow, totalRow, 0, 0, { alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
      styleRange(ws, totalRow + 2, totalRow + 2, 1, Math.min(10, lastCol), { font: { bold: true, sz: 10 }, alignment: { horizontal: 'left', vertical: 'center', wrapText: false } });
    }

    function styleRange(ws, r1, r2, c1, c2, style) {
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (!ws[addr]) ws[addr] = { t: 's', v: '' };
          ws[addr].s = mergeStyle(ws[addr].s || {}, style);
        }
      }
    }

    function eachCell(ws, r1, r2, c1, c2, cb) {
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (ws[addr]) cb(ws[addr], r, c);
        }
      }
    }

    function applyBoxBorder(ws, r1, c1, r2, c2, line) {
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (!ws[addr]) ws[addr] = { t: 's', v: '' };
          const existing = (ws[addr].s && ws[addr].s.border) ? ws[addr].s.border : {};
          const border = { ...existing };
          if (r === r1) border.top = line;
          if (r === r2) border.bottom = line;
          if (c === c1) border.left = line;
          if (c === c2) border.right = line;
          ws[addr].s = mergeStyle(ws[addr].s || {}, { border });
        }
      }
    }

    function applyMiddleBorder(ws, r1, r2, leftCol, rightCol, line) {
      for (let r = r1; r <= r2; r++) {
        const leftAddr = XLSX.utils.encode_cell({ r, c: leftCol });
        if (!ws[leftAddr]) ws[leftAddr] = { t: 's', v: '' };
        const leftBorder = { ...((ws[leftAddr].s && ws[leftAddr].s.border) ? ws[leftAddr].s.border : {}), right: line };
        ws[leftAddr].s = mergeStyle(ws[leftAddr].s || {}, { border: leftBorder });

        const rightAddr = XLSX.utils.encode_cell({ r, c: rightCol });
        if (!ws[rightAddr]) ws[rightAddr] = { t: 's', v: '' };
        const rightBorder = { ...((ws[rightAddr].s && ws[rightAddr].s.border) ? ws[rightAddr].s.border : {}), left: line };
        ws[rightAddr].s = mergeStyle(ws[rightAddr].s || {}, { border: rightBorder });
      }
    }

    function applyCleanFooterBorders(ws, r1, r2, c1, c2, thinLine, middleLine) {
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const addr = XLSX.utils.encode_cell({ r, c });
          if (!ws[addr]) ws[addr] = { t: 's', v: '' };
          const border = { top: thinLine, bottom: thinLine };
          if (c === c1) border.left = thinLine;
          if (c === c2) border.right = thinLine;
          if (c === c1 + 3) border.right = middleLine;
          if (c === c1 + 4) border.left = middleLine;
          ws[addr].s = { ...(ws[addr].s || {}), border };
        }
      }
    }

    function mergeStyle(a = {}, b = {}) {
      const out = { ...a, ...b };
      if (a.font || b.font) out.font = { ...(a.font || {}), ...(b.font || {}) };
      if (a.alignment || b.alignment) out.alignment = { ...(a.alignment || {}), ...(b.alignment || {}) };
      if (a.border || b.border) out.border = { ...(a.border || {}), ...(b.border || {}) };
      if (a.numFmt || b.numFmt) out.numFmt = b.numFmt || a.numFmt;
      if (a.fill || b.fill) {
        const fill = { ...(a.fill || {}), ...(b.fill || {}) };
        if (Object.keys(fill).length) out.fill = fill;
      } else {
        delete out.fill;
      }
      return out;
    }

    function buildColumnWidths(sizeCount) {
      const widths = [7.5, 5.0, 7.5, 20, 28, 18];
      for (let i = 0; i < sizeCount; i++) widths.push(5.0);
      widths.push(7.8, 8.0, 8.2, 8.2, 10.5, 10.5, 8.5);
      return widths.map(wch => ({ wch }));
    }

    function buildRowHeights(totalRow) {
      const rows = [];
      for (let i = 0; i <= totalRow + 2; i++) {
        let hpt = 16;
        if (i === 0) hpt = 22;
        if (i === 3) hpt = 20;
        if (i === 6) hpt = 18;
        if (i === 8) hpt = 24;
        if (i > 8 && i < totalRow) hpt = 18;
        if (i === totalRow) hpt = 18;
        if (i === totalRow + 2) hpt = 22;
        rows.push({ hpt });
      }
      return rows;
    }


    function downloadLabelsXlsx() {
      if (!activeLabelsData.length) {
        alert('No labels generated yet.');
        return;
      }
      const meta = activeLabelMeta || getControlsMeta();
      const wb = XLSX.utils.book_new();

      // IMPORTANT: one Excel worksheet tab = one printed A4 sheet.
      // This guarantees exactly 4 labels per sheet:
      // 1-4 labels => Sheet 1, 5-8 labels => Sheet 2, 9-12 labels => Sheet 3, etc.
      const pageCount = Math.ceil(activeLabelsData.length / 4);
      for (let page = 0; page < pageCount; page++) {
        const pageLabels = activeLabelsData.slice(page * 4, page * 4 + 4);
        const ws = buildLabelsWorksheet(pageLabels, meta);
        XLSX.utils.book_append_sheet(wb, ws, `Labels ${page + 1}`);
      }

      const fileName = safeFileName(`Dior Labels ${meta.orderNo || activeJob?.orderNo || ''} ${meta.commessaNo || activeJob?.commessaNo || ''}.xlsx`) || 'Dior_Labels.xlsx';
      XLSX.writeFile(wb, fileName, { bookType: 'xlsx', compression: true });
    }

    function buildLabelsWorksheet(labelsData, meta) {
      // 6 worksheet columns per label gives the Excel export the same room as the working template,
      // while still printing 4 labels per A4 landscape sheet/tab.
      const LABEL_COLS = 6;
      // Template uses 13 visible label rows. Two blank rows separate the top and bottom labels.
      const LABEL_ROWS = 13;
      const SPACER_COLS = 1;
      const SPACER_ROWS = 2;
      const PAGE_ROWS = LABEL_ROWS * 2 + SPACER_ROWS;
      const lastCol = LABEL_COLS * 2 + SPACER_COLS - 1;
      const totalRows = PAGE_ROWS;
      const aoa = [];
      for (let r = 0; r < totalRows; r++) aoa[r] = Array(lastCol + 1).fill('');

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const merges = [];
      ws['!merges'] = merges;
      ws['!cols'] = buildLabelColumnWidths();
      ws['!rows'] = buildLabelRowHeights(totalRows, LABEL_ROWS, SPACER_ROWS, PAGE_ROWS);
      // Match the uploaded label template: A4 landscape, very small margins, 4 labels per sheet.
      ws['!margins'] = { left: 0, right: 0, top: 0.11811023622047245, bottom: 0.11811023622047245, header: 0, footer: 0 };
      ws['!pageSetup'] = { paperSize: 9, orientation: 'landscape', scale: 78 };
      ws['!sheetPr'] = { pageSetUpPr: { fitToPage: false } };
      ws['!printOptions'] = { gridLines: false };

      const whiteFill = { patternType: 'solid', fgColor: { rgb: 'FFFFFF' }, bgColor: { rgb: 'FFFFFF' } };
      styleRange(ws, 0, totalRows - 1, 0, lastCol, { fill: whiteFill, font: { name: 'Calibri', sz: 16, bold: true }, alignment: { vertical: 'center', horizontal: 'center', wrapText: false } });

      labelsData.forEach((label, idx) => {
        const pos = idx % 4;
        const blockRow = Math.floor(pos / 2);
        const blockCol = pos % 2;
        const sr = blockRow * (LABEL_ROWS + SPACER_ROWS);
        const sc = blockCol * (LABEL_COLS + SPACER_COLS);
        writeOneLabelXlsx(ws, merges, sr, sc, label, meta);
      });

      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: totalRows - 1, c: lastCol } });
      return ws;
    }

    function buildLabelColumnWidths() {
      // Exact 6-column label layout, but with the code-article columns widened.
      // Excel columns B/C and I/J are the merged CODE ARTICLE cells.
      // Requested pixel widths: B/I = 105px, C/J = 91px.
      const labelCols = [
        { wch: 21.55 }, // A / H - COLOR + parcel side
        { wpx: 105 },   // B / I - CODE ARTICLE part 1
        { wpx: 91 },    // C / J - CODE ARTICLE part 2
        { wch: 12.11 }, // D / K - SIZE
        { wch: 12.11 }, // E / L - TOTAL QTY part 1
        { wch: 12.11 }  // F / M - TOTAL QTY part 2
      ];
      return [...labelCols, { wch: 1.0 }, ...labelCols];
    }

    function buildLabelRowHeights(totalRows, labelRows, spacerRows, pageRows) {
      // Row heights copied from the Excel template.
      // Top label: rows 1-13, spacer rows 14-15, bottom label: rows 16-28.
      const templateHeights = [
        51.6, 15, 75, 16.2, 22.5, 15, 22.5, 22.5, 22.5, 22.5, 26.25, 18.75, 18.75,
        6.75, 15,
        51.6, 15, 75, 16.2, 22.5, 15, 22.5, 22.5, 22.5, 22.5, 26.25, 18.75, 18.75
      ];
      const rows = [];
      for (let r = 0; r < totalRows; r++) rows.push({ hpt: templateHeights[r] || 15 });
      return rows;
    }

    function writeOneLabelXlsx(ws, merges, sr, sc, data, meta) {
      // Excel label export now follows the uploaded Dior template structure:
      // 6 physical columns per label, 13 rows per label, and two spacer rows between top/bottom labels.
      const borderThin = { style: 'thin', color: { rgb: '000000' } };
      const borderMed = { style: 'medium', color: { rgb: '000000' } };
      const allThin = { top: borderThin, bottom: borderThin, left: borderThin, right: borderThin };
      const horizThin = { top: borderThin, bottom: borderThin };
      const whiteFill = { patternType: 'solid', fgColor: { rgb: 'FFFFFF' }, bgColor: { rgb: 'FFFFFF' } };
      const yellowFill = { patternType: 'solid', fgColor: { rgb: 'FFFF00' }, bgColor: { rgb: 'FFFF00' } };
      const font16 = { name: 'Calibri', sz: 16, bold: true };
      const fontTitle = { name: 'Calibri', sz: 20, bold: true };
      const fontSmall = { name: 'Calibri', sz: 8, bold: true };
      const singleLineCenter = { horizontal: 'center', vertical: 'center', wrapText: false };
      const singleLineLeft = { horizontal: 'left', vertical: 'center', wrapText: false };
      const singleLineRight = { horizontal: 'right', vertical: 'center', wrapText: false };

      styleRange(ws, sr, sr + 12, sc, sc + 5, {
        font: font16,
        alignment: singleLineCenter,
        fill: whiteFill
      });

      // 1) Top PAP row: one single large merged cell with bold outer border.
      mergeSet(ws, merges, sr, sc, sr, sc + 5, meta.pap || 'PAP F', {
        font: fontTitle,
        alignment: singleLineCenter,
        border: allThin,
        fill: whiteFill
      });
      applyBoxBorder(ws, sr, sc, sr, sc + 5, borderMed);

      // 2) Address titles and address body, aligned with the 6-column template.
      mergeSet(ws, merges, sr + 1, sc, sr + 1, sc + 2, 'PARCEL FOR:', {
        font: fontSmall,
        alignment: { horizontal: 'left', vertical: 'center', wrapText: false },
        border: allThin,
        fill: whiteFill
      });
      mergeSet(ws, merges, sr + 1, sc + 3, sr + 1, sc + 5, 'SUPPLIER NAME:', {
        font: fontSmall,
        alignment: { horizontal: 'left', vertical: 'center', wrapText: false },
        border: allThin,
        fill: whiteFill
      });

      const parcelAddress = compactParcelAddressForLabel(meta.destinationAddress, FRANCE_GXO_ADDRESS);
      const supplierAddress = compactSupplierAddressForLabel(meta.supplierAddress, 'PELINTEX BULGARIA\n5 HRISTO BOTEV\n7000 RUSE, BULGARIA');
      mergeSet(ws, merges, sr + 2, sc, sr + 3, sc + 2, parcelAddress, {
        font: font16,
        alignment: { horizontal: 'left', vertical: 'center', wrapText: true },
        border: allThin,
        fill: whiteFill
      });
      mergeSet(ws, merges, sr + 2, sc + 3, sr + 3, sc + 5, supplierAddress, {
        font: font16,
        alignment: { horizontal: 'left', vertical: 'center', wrapText: true },
        border: allThin,
        fill: whiteFill
      });

      // 3) PO / COMMESA row.
      mergeSet(ws, merges, sr + 4, sc, sr + 4, sc + 2, `PO: ${meta.orderNo || ''}`, {
        font: font16,
        alignment: singleLineLeft,
        border: allThin,
        fill: yellowFill
      });
      mergeSet(ws, merges, sr + 4, sc + 3, sr + 4, sc + 5, `COMMESA: ${meta.commessaNo || ''}`, {
        font: font16,
        alignment: singleLineLeft,
        border: allThin,
        fill: yellowFill
      });

      // 4) Matrix table. Physical columns: COLOR | CODE ARTICLE merged B:C | SIZE | TOTAL QTY merged E:F.
      const headerBorder = { top: borderThin, bottom: borderMed, left: borderThin, right: borderThin };
      setCell(ws, sr + 5, sc, 'COLOR', { font: fontSmall, alignment: singleLineCenter, border: headerBorder, fill: whiteFill });
      mergeSet(ws, merges, sr + 5, sc + 1, sr + 5, sc + 2, 'CODE ARTICLE', { font: fontSmall, alignment: singleLineCenter, border: headerBorder, fill: whiteFill });
      setCell(ws, sr + 5, sc + 3, 'SIZE', { font: fontSmall, alignment: singleLineCenter, border: headerBorder, fill: whiteFill });
      mergeSet(ws, merges, sr + 5, sc + 4, sr + 5, sc + 5, 'TOTAL QTY', { font: fontSmall, alignment: singleLineCenter, border: headerBorder, fill: whiteFill });

      const displayRows = (data.sizes || []).slice(0, 4);
      while (displayRows.length < 4) displayRows.push({ size: '', qty: '' });
      for (let i = 0; i < 4; i++) {
        const r = sr + 6 + i;
        const s = displayRows[i] || {};
        setCell(ws, r, sc, i === 0 ? (data.color || '') : '', { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
        mergeSet(ws, merges, r, sc + 1, r, sc + 2, i === 0 ? (data.codeArticle || '') : '', { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
        setCell(ws, r, sc + 3, valueOrBlank(s.size), { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
        mergeSet(ws, merges, r, sc + 4, r, sc + 5, valueOrBlank(s.qty), { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
      }

      // Bold section around all info below PAP up to the end of matrix, plus the middle split A:C / D:F.
      applyBoxBorder(ws, sr + 1, sc, sr + 9, sc + 5, borderMed);
      applyMiddleBorder(ws, sr + 1, sr + 9, sc + 2, sc + 3, borderMed);

      // 5) Footer rows copied from the template.
      // TOTAL row: no internal vertical borders; only the row frame.
      setCell(ws, sr + 10, sc, 'TOTAL ', {
        font: font16,
        alignment: singleLineCenter,
        border: { top: borderThin, bottom: borderThin, left: borderThin },
        fill: whiteFill
      });
      setCell(ws, sr + 10, sc + 1, '', { font: font16, alignment: singleLineCenter, border: horizThin, fill: whiteFill });
      setCell(ws, sr + 10, sc + 2, data.totalQty || '', { font: font16, alignment: singleLineRight, border: horizThin, fill: whiteFill });
      setCell(ws, sr + 10, sc + 3, 'PIECES', { font: font16, alignment: singleLineCenter, border: horizThin, fill: whiteFill });
      setCell(ws, sr + 10, sc + 4, '', { font: font16, alignment: singleLineCenter, border: horizThin, fill: whiteFill });
      setCell(ws, sr + 10, sc + 5, '', { font: font16, alignment: singleLineCenter, border: { top: borderThin, bottom: borderThin, right: borderThin }, fill: whiteFill });
      applyBoxBorder(ws, sr + 10, sc, sr + 10, sc + 5, borderMed);

      // CARTON row: A:B label, C number, D OF, E:F total packages.
      mergeSet(ws, merges, sr + 11, sc, sr + 11, sc + 1, 'CARTON NUMBER', {
        font: font16,
        alignment: singleLineCenter,
        border: allThin,
        fill: whiteFill
      });
      setCell(ws, sr + 11, sc + 2, data.cartonNum || '', { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
      setCell(ws, sr + 11, sc + 3, 'OF', { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
      mergeSet(ws, merges, sr + 11, sc + 4, sr + 11, sc + 5, data.totalPackages || '', {
        font: font16,
        alignment: singleLineCenter,
        border: allThin,
        fill: whiteFill
      });
      applyBoxBorder(ws, sr + 11, sc, sr + 11, sc + 5, borderMed);

      // WEIGHT row: A:B net label, C net value, D:E gross label, F gross value.
      mergeSet(ws, merges, sr + 12, sc, sr + 12, sc + 1, 'NETT WEIGHT KG', {
        font: font16,
        alignment: singleLineCenter,
        border: allThin,
        fill: whiteFill
      });
      setCell(ws, sr + 12, sc + 2, formatWeight(data.netWt), { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
      mergeSet(ws, merges, sr + 12, sc + 3, sr + 12, sc + 4, 'GROSS WEIGHT KG', {
        font: font16,
        alignment: singleLineCenter,
        border: allThin,
        fill: whiteFill
      });
      setCell(ws, sr + 12, sc + 5, formatWeight(data.grossWt), { font: font16, alignment: singleLineCenter, border: allThin, fill: whiteFill });
      applyBoxBorder(ws, sr + 12, sc, sr + 12, sc + 5, borderMed);

      // Strong outer frame last.
      applyBoxBorder(ws, sr, sc, sr + 12, sc + 5, borderMed);
    }

    function setCell(ws, r, c, value, style) {
      const addr = XLSX.utils.encode_cell({ r, c });
      const cell = ws[addr] || { t: 's', v: '' };
      if (typeof value === 'number') {
        cell.t = 'n';
        cell.v = value;
      } else {
        cell.t = 's';
        cell.v = value === null || value === undefined ? '' : String(value);
      }
      ws[addr] = cell;
      if (style) ws[addr].s = mergeStyle(ws[addr].s || {}, style);
    }

    function mergeSet(ws, merges, r1, c1, r2, c2, value, style) {
      const addr = XLSX.utils.encode_cell({ r: r1, c: c1 });
      const cell = ws[addr] || { t: 's', v: '' };
      if (typeof value === 'number') {
        cell.t = 'n';
        cell.v = value;
      } else {
        cell.t = 's';
        cell.v = value === null || value === undefined ? '' : String(value);
      }
      ws[addr] = cell;
      if (r1 !== r2 || c1 !== c2) merges.push({ s: { r: r1, c: c1 }, e: { r: r2, c: c2 } });
      styleRange(ws, r1, r2, c1, c2, style);
    }

    function compactParcelAddressForLabel(address, fallback) {
      const lines = String(address || fallback || '')
        .split(/\r?\n/)
        .map(x => x.trim().replace(/\u0016/g, ''))
        .filter(Boolean);
      if (!lines.length) return '';
      // Keep parcel address as one logical line; the merged A:C cell wraps it naturally into fewer lines.
      return lines.join(', ').replace(/,\s*,/g, ', ').replace(/\s+/g, ' ').trim();
    }

    function compactSupplierAddressForLabel(address, fallback) {
      let lines = String(address || fallback || '')
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);
      if (!lines.length) return '';

      // Keep supplier compact: 3 lines max, with city/country combined.
      if (lines.length >= 2) {
        const last = lines[lines.length - 1];
        const prev = lines[lines.length - 2];
        if (/^(FRANCE|BULGARIA|ITALY|ITALIA)$/i.test(last) && !new RegExp(last, 'i').test(prev)) {
          lines.splice(lines.length - 2, 2, `${prev}, ${last.toUpperCase()}`);
        }
      }
      while (lines.length > 3) lines.splice(1, 2, `${lines[1]}, ${lines[2]}`);
      return lines.join('\n');
    }

    function compactAddressForLabel(address, fallback) {
      // Backwards-compatible wrapper for any older call sites.
      return compactSupplierAddressForLabel(address, fallback);
    }

    function valueOrBlank(value) {
      if (value === null || value === undefined) return '';
      return String(value) === '' ? '' : value;
    }

    function printLabels() {
      if (!activeLabelsData.length) {
        alert('No labels generated yet.');
        return;
      }
      const oldTitle = document.title;
      document.title = safeFileName(`Dior Labels ${activeJob?.orderNo || ''} ${activeJob?.commessaNo || ''}`) || 'Dior Labels';
      window.print();
      setTimeout(() => { document.title = oldTitle; }, 800);
    }

    function firstMatch(text, regex) {
      const m = String(text || '').match(regex);
      return m ? (m[1] || '').trim() : '';
    }

    function parseEuroNumber(value) {
      if (value === null || value === undefined || value === '') return NaN;
      let s = String(value).trim().replace(/\s/g, '');
      if (!s) return NaN;
      if (s.includes(',') && s.includes('.')) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else {
        s = s.replace(',', '.');
      }
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function isSizeToken(s) {
      return /^(?:XXXL|XXL|XL|XS|S|M|L|\d{1,3}R?)$/i.test(String(s || '').trim());
    }

    function compareSizesKeepingCommonOrder(a, b) {
      const order = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
      const ai = order.indexOf(String(a).toUpperCase());
      const bi = order.indexOf(String(b).toUpperCase());
      if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      const an = parseFloat(a), bn = parseFloat(b);
      if (Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
      return String(a).localeCompare(String(b), undefined, { numeric: true });
    }

    function emptySizeMap(sizeColumns) {
      const obj = {};
      sizeColumns.forEach(s => obj[s] = 0);
      return obj;
    }

    function sizeKey(sizeMap, sizeColumns) {
      return sizeColumns.map(s => `${s}:${sizeMap[s] || 0}`).join('|');
    }

    function sumValues(obj) {
      return Object.values(obj || {}).reduce((a, b) => a + (parseFloat(b) || 0), 0);
    }

    function sumRows(rows, key) {
      return round2(rows.reduce((sum, row) => sum + (parseFloat(row[key]) || 0), 0));
    }

    function round2(n) { return Math.round((parseFloat(n) || 0) * 100) / 100; }
    function formatWeight(wt) { const n = parseFloat(wt); return Number.isFinite(n) ? n.toFixed(2) : wt; }
    function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function unique(arr) { return Array.from(new Set(arr)); }
    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function colLetter(n) {
      let s = '';
      while (n > 0) {
        const m = (n - 1) % 26;
        s = String.fromCharCode(65 + m) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    }

    function normalizeCartonSpec(value) {
      const cleaned = String(value || '').trim().replace(/\s+/g, ' ');
      if (!cleaned) return 'colis 60/40/15';
      return /^colis\b/i.test(cleaned) ? cleaned : `colis ${cleaned}`;
    }

    function safeFileName(name) {
      return String(name || 'file').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
    }
  </script>
  <script src="edit-layer.js"></script>
