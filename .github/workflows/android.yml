name: Build APK
on:
  push:
    paths: ['ytmp3/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: ytmp3
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp ytmp3/app/build/outputs/apk/release/app-release.apk YtMp3.apk

      # Plain APK (no zip) at a fixed release link that is easy to open from the phone.
      - name: Publish to "ytmp3-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytmp3-latest
          name: YT MP3 – последен APK
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: YtMp3.apk
          body: |
            Автоматично сглобен от ${{ github.ref_name }} (${{ github.sha }}).
            Свали YtMp3.apk и го инсталирай (разреши „Инсталиране от неизвестни източници“).
