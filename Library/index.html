<title>The Library of Every Book</title>
<meta name="description" content="An idle game about reading every book in the Library.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root {
  --bg: #efe6d3; --panel: #e6dac2; --card: #f7f0e1; --card2: #efe5d0; --line: #cdbc9c; --line2: #b9a684;
  --ink: #2a2118; --muted: #6d5d48; --faint: #9a8a70;
  --lamp: #9a5f14; --lamp-soft: rgba(154, 95, 20, .12);
  --meaning: #3c7663; --memory: #6a579c; --depth: #2c6a8f; --aeon: #8b5a2b; --grace: #7d6415; --danger: #a4412c; --good: #4d7a36;
  --paper: #e8dcc0; --paper-ink: #2d2419; --shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 18px -10px rgba(60, 40, 10, .35);
  --f-display: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --f-body: 'Spectral', 'Iowan Old Style', Georgia, serif;
  --f-mono: 'Courier Prime', 'Courier New', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110d; --panel: #1b1712; --card: #221d16; --card2: #1e1914; --line: #362d23; --line2: #4a3e30;
    --ink: #eadcc1; --muted: #a8967c; --faint: #75674f;
    --lamp: #e3a94f; --lamp-soft: rgba(227, 169, 79, .10);
    --meaning: #8fbfab; --memory: #b8a8e0; --depth: #7fb2d3; --aeon: #d0a275; --grace: #efe0ae; --danger: #d9785f; --good: #9cc67f;
    --shadow: 0 1px 0 rgba(255,255,255,.02), 0 10px 24px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14110d; --panel: #1b1712; --card: #221d16; --card2: #1e1914; --line: #362d23; --line2: #4a3e30;
  --ink: #eadcc1; --muted: #a8967c; --faint: #75674f;
  --lamp: #e3a94f; --lamp-soft: rgba(227, 169, 79, .10);
  --meaning: #8fbfab; --memory: #b8a8e0; --depth: #7fb2d3; --aeon: #d0a275; --grace: #efe0ae; --danger: #d9785f; --good: #9cc67f;
  --shadow: 0 1px 0 rgba(255,255,255,.02), 0 10px 24px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.sc { font-variant: small-caps; letter-spacing: .06em; text-transform: lowercase; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#app { display: grid; grid-template-rows: auto 1fr; height: 100%; min-height: 0; }
/* ---------- header ---------- */
#top { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; flex-direction: column; min-width: 190px; flex: 1 1 220px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1; letter-spacing: .01em; }
.brand h1 i { color: var(--lamp); font-style: italic; }
.brand .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.goalbar { height: 3px; background: var(--line); margin-top: 6px; position: relative; overflow: hidden; border-radius: 2px; max-width: 320px; }
.goalbar b { position: absolute; inset: 0 auto 0 0; background: var(--lamp); }
#res { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.rc { display: flex; flex-direction: column; min-width: 78px; }
.rc .l { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.rc .v { font-size: 17px; font-weight: 600; }
.rc .r { font-size: 11.5px; color: var(--muted); }
.rc.pages .v { color: var(--ink); } .rc.frag .v { color: var(--meaning); } .rc.mem .v { color: var(--memory); } .rc.depth .v { color: var(--depth); } .rc.aeon .v { color: var(--aeon); } .rc.grace .v { color: var(--grace); }
#clock { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; color: var(--muted); }
#clock .dial { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); position: relative; background: conic-gradient(var(--lamp) var(--p, 0%), transparent 0); }
#clock .dial::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); }
#clock .dial i { position: absolute; inset: 11px; border-radius: 50%; background: var(--lamp); z-index: 1; opacity: var(--light, 1); box-shadow: 0 0 10px var(--lamp); }
#clock b { color: var(--ink); font-weight: 600; }

/* ---------- main ---------- */
main { display: grid; grid-template-rows: minmax(330px, 50%) minmax(0, 1fr); min-height: 0; }
#topRow { display: grid; grid-template-columns: minmax(340px, 40%) 1fr; min-height: 0; border-bottom: 1px solid var(--line); background: #0d0b09; }
#bookpane { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px 10px; min-height: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, #2b2016 0%, #17110b 62%, #0d0a07 100%); border-right: 1px solid #000; }
#bookpane::before { content: ''; position: absolute; left: 50%; top: 0; width: 240px; height: 100%; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 30%, rgba(255, 214, 140, .10), transparent 70%); pointer-events: none; }
#stage { position: relative; overflow: hidden; background: #0d0b09; min-height: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#hud { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 3; }
.chip { pointer-events: auto; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(20, 16, 12, .72); color: #e9dcc2; border: 1px solid rgba(233, 207, 160, .18); backdrop-filter: blur(3px); }
.chip b { color: #f0c173; font-weight: 600; }
.chip.warn { border-color: rgba(217, 120, 95, .5); }

/* the open book, with a real page-turn */
#bookwrap { position: relative; width: min(100%, 560px); z-index: 2; flex: 0 1 auto; }
#book { position: relative; display: grid; grid-template-columns: 1fr 1fr; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  perspective: 1800px; perspective-origin: 50% 40%; filter: drop-shadow(0 22px 26px rgba(0,0,0,.6)); }
#book::before { content: ''; position: absolute; inset: 8px -7px -9px; border-radius: 8px; z-index: -1; background: linear-gradient(90deg, #3a2414, #4d321c 50%, #3a2414); box-shadow: 0 3px 0 #23150b; }
#book::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 5px; background: repeating-linear-gradient(90deg, #d8cba9 0 3px, #c2b38f 3px 4px); border-radius: 0 0 6px 6px; opacity: .9; z-index: -1; }
.pg { background: linear-gradient(90deg, #d9c9a8, #e9dcc0 12%, #eadfc5 88%, #d6c6a4); color: var(--paper-ink); padding: 12px 13px 22px; min-height: 120px; font-family: var(--f-mono); font-size: 11px; line-height: 1.45; overflow: hidden; position: relative; }
#pgL { border-radius: 6px 0 0 6px; background: linear-gradient(90deg, #cdbd9a, #e6d9bc 10%, #e9ddc2 92%, #c9b894); box-shadow: inset -14px 0 18px -12px rgba(60,40,15,.6); }
#pgR { border-radius: 0 6px 6px 0; box-shadow: inset 14px 0 18px -12px rgba(60,40,15,.6); }
.pg .ln { white-space: pre; letter-spacing: .02em; }
.pg .hd { font-family: var(--f-display); font-size: 12px; color: #6d5a40; margin-bottom: 6px; display: flex; justify-content: space-between; }
.pg .ft { position: absolute; bottom: 7px; left: 0; right: 0; text-align: center; font-size: 10.5px; color: #7c6749; }
.pg mark { background: none; color: #8a3a12; font-weight: 700; border-bottom: 1px dotted #8a3a12; cursor: help; }
.pg mark.dark { color: #7a0f14; border-bottom-color: #7a0f14; }
#leaves { position: absolute; inset: 0; pointer-events: none; transform-style: preserve-3d; }
.leaf { position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: 0 50%; transform-style: preserve-3d; will-change: transform; animation: leafturn var(--dur, .55s) cubic-bezier(.5, .08, .3, 1) forwards; }
.leaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.leaf .back { transform: rotateY(180deg); }
.leaf .face::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
.leaf .front::after { background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(40,25,8,.35) 100%); animation: shadeF var(--dur, .55s) ease-in forwards; }
.leaf .back::after { background: linear-gradient(90deg, rgba(40,25,8,.4) 0%, rgba(0,0,0,0) 100%); animation: shadeB var(--dur, .55s) ease-out forwards; }
.leaf .back.pg { border-radius: 6px 0 0 6px; background: linear-gradient(90deg, #cdbd9a, #e6d9bc 10%, #e9ddc2 92%, #c9b894); box-shadow: none; }
.leaf .front.pg { box-shadow: none; }
@keyframes leafturn {
  0% { transform: rotateY(0deg) translateZ(0); }
  22% { transform: rotateY(-26deg) skewY(-1.5deg) translateZ(3px); }
  50% { transform: rotateY(-90deg) skewY(0deg) translateZ(9px); }
  78% { transform: rotateY(-154deg) skewY(1.2deg) translateZ(3px); }
  100% { transform: rotateY(-180deg) translateZ(0); }
}
@keyframes shadeF { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }
@keyframes shadeB { 0% { opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0; } }
#focus { margin: 10px auto 0; width: 82%; display: flex; align-items: center; gap: 8px; color: #d8c8a8; font-size: 12px; }
#focus .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
#focus .bar b { display: block; height: 100%; background: linear-gradient(90deg, #b9802f, #f0c173); width: 0; transition: width .1s; }
#clickinfo { text-align: center; font-size: 12.5px; color: #cdbd9d; margin-top: 6px; text-shadow: 0 1px 2px #000; }
#prestige { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: min(100%, 560px); z-index: 3; }
#prestige:empty { display: none; }
.pbtn { border: 1px solid rgba(240, 193, 115, .35); background: rgba(22, 17, 12, .82); color: #eadcc1; border-radius: 8px; padding: 5px 10px; cursor: pointer; text-align: left; font-size: 13px; line-height: 1.2; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
.pbtn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn small { color: #bfae8d; font-size: 11px; white-space: nowrap; }
.pbtn b { font-weight: 600; }
.pbtn.res b { color: #c9b8ef; } .pbtn.fall b { color: #8fc3e4; } .pbtn.aeon b { color: #dfb080; } .pbtn.grace b { color: #f6e8b8; } .pbtn.trial b { color: #f0a58f; }
.pbtn:hover { border-color: rgba(240, 193, 115, .8); }
.pbtn.locked { opacity: .55; cursor: default; }
.float { position: fixed; pointer-events: none; font-weight: 700; color: #f6d38f; text-shadow: 0 1px 3px #000; font-size: 14px; animation: rise 1s ease-out forwards; z-index: 55; white-space: nowrap; }
.float.crit { color: #ffb36b; font-size: 17px; }
@keyframes rise { to { transform: translateY(-46px); opacity: 0; } }
.loose { position: absolute; z-index: 4; width: 42px; height: 54px; cursor: pointer; background: linear-gradient(160deg, #f1e6cb, #d7c49e); border-radius: 2px 8px 2px 6px; box-shadow: 0 6px 14px rgba(0,0,0,.5), 0 0 22px rgba(240,193,115,.55); animation: drift 3.2s ease-in-out infinite alternate; border: none; padding: 0; }
.loose::before { content: ''; position: absolute; inset: 9px 7px; background: repeating-linear-gradient(#8a7650 0 1px, transparent 1px 5px); opacity: .6; }
@keyframes drift { from { transform: rotate(-10deg) translateY(-6px); } to { transform: rotate(9deg) translateY(8px); } }
#duelask { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 12px; border-radius: 10px; background: rgba(28, 8, 8, .86); border: 1px solid rgba(224, 90, 70, .6); color: #f1d9c8; max-width: 94%; box-shadow: 0 0 30px rgba(180, 30, 20, .35); }
#duelask b { color: #ff9f8a; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
#minibar { position: absolute; left: 8px; right: 8px; top: 6px; padding: 5px 10px; border-radius: 9px; background: rgba(10, 8, 6, .78); z-index: 6; display: flex; gap: 10px; align-items: center; pointer-events: none; color: #f0e2c6; font-size: 12.5px; }
#minibar .mb { flex: 1; height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
#minibar .mb b { display: block; height: 100%; background: linear-gradient(90deg, #a13a2a, #ff9f6a); }
#minibar .hearts { letter-spacing: 3px; font-size: 15px; color: #ff7d66; }
#minibar .mt { font-family: var(--f-display); font-size: 15px; }
#minibar .mx { pointer-events: auto; }
/* ---------- panel ---------- */
#panel { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--bg); }
#tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
#tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 7px 9px 8px; cursor: pointer; color: var(--muted); font-size: 13.5px; letter-spacing: .03em; position: relative; }
#tabs button:hover { color: var(--ink); }
#tabs button.on { color: var(--ink); border-bottom-color: var(--lamp); }
#tabs button .dot { position: absolute; top: 5px; right: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--lamp); }
#body { overflow-y: auto; padding: 16px 18px 40px; min-height: 0; }
.sect { margin-bottom: 22px; }
.sect > h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
.sect > p.lead { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; max-width: 68ch; }
h3.sub { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line2); background: var(--card); border-radius: 6px; padding: 6px 11px; cursor: pointer; font-size: 13px; line-height: 1.25; }
.btn:hover:not(:disabled) { border-color: var(--lamp); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--lamp); color: var(--bg); border-color: var(--lamp); font-weight: 600; }
.btn.ok { border-color: var(--lamp); box-shadow: inset 0 0 0 1px var(--lamp-soft); }
.btn.on { background: var(--lamp-soft); border-color: var(--lamp); }
.btn small { display: block; font-size: 11.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { border: none; background: var(--card); padding: 5px 10px; cursor: pointer; font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--lamp-soft); color: var(--lamp); font-weight: 600; }

/* catalogue card */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 11px 12px 10px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer;
  background-image: repeating-linear-gradient(to bottom, transparent 0 21px, var(--line) 21px 22px); background-position: 0 30px; background-size: 100% calc(100% - 30px); background-repeat: no-repeat; }
.card::before { content: ''; position: absolute; left: 0; right: 0; top: 29px; height: 1px; background: color-mix(in srgb, var(--danger) 55%, transparent); }
.card .t { font-weight: 600; font-size: 14px; line-height: 1.2; min-height: 18px; }
.card .d { font-size: 12.8px; color: var(--ink); line-height: 1.55; }
.card .f { font-size: 12px; color: var(--muted); font-style: italic; line-height: 1.5; }
.card .c { margin-top: auto; padding-top: 4px; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.card .c b { color: var(--ink); font-weight: 600; }
.card.can { border-color: var(--lamp); }
.card.can .c b { color: var(--lamp); }
.card.no { cursor: default; }
.card.no .c b { color: var(--danger); }
.card.own { cursor: default; opacity: .72; }
.card.own .c b { color: var(--good); }
.card.lock { cursor: default; opacity: .5; }
.card .hole { position: absolute; bottom: 7px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); opacity: .8; }

/* tier rows */
.tiers { display: flex; flex-direction: column; gap: 6px; }
.tier { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; align-items: center; }
.tier .nm { font-weight: 600; }
.tier .nm .roman { font-family: var(--f-display); color: var(--lamp); margin-right: 6px; font-weight: 400; }
.tier .meta { font-size: 12.5px; color: var(--muted); }
.tier .meta b { color: var(--ink); font-weight: 600; }
.tier .buys { display: flex; gap: 6px; grid-row: span 2; }
.tier .buys .btn { min-width: 86px; text-align: center; }
.tier .setbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; grid-column: 1; }
.tier .setbar b { display: block; height: 100%; background: var(--lamp); }
.tier.locked { opacity: .45; }

.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
.item .nm { font-weight: 600; }
.item .nm em { font-style: normal; color: var(--lamp); font-weight: 600; margin-left: 6px; }
.item .d { font-size: 12.8px; color: var(--muted); }
.item .act { grid-row: span 2; display: flex; gap: 6px; }
.pbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.pbar b { display: block; height: 100%; background: var(--lamp); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.note { font-size: 12.5px; color: var(--muted); }
.milestones { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.milestones div { display: flex; gap: 10px; color: var(--faint); }
.milestones div.got { color: var(--ink); }
.milestones div span:first-child { min-width: 48px; font-variant-numeric: tabular-nums; color: var(--lamp); }
.milestones div:not(.got) span:first-child { color: var(--faint); }

/* chasm tree */
.tree { position: relative; display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 26px 12px; overflow-x: auto; padding: 4px 2px 8px; }
.tree svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.tree .card { z-index: 1; min-height: 118px; }
.tree-wrap { overflow-x: auto; }

/* trials */
.pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--lamp); display: inline-block; }
.pips i.f { background: var(--lamp); }

/* achievements */
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ach { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12px; background: var(--card2); color: var(--faint); min-height: 52px; }
.ach b { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.ach.got { background: var(--card); color: var(--muted); border-color: var(--line2); }
.ach.got b { color: var(--ink); }
.ach.got::after { content: '✓'; float: right; color: var(--lamp); margin-top: -34px; }

/* journal */
.entry { padding: 12px 0 14px; border-bottom: 1px solid var(--line); max-width: 66ch; }
.entry h4 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.entry p { margin: 0; line-height: 1.65; }
.entry.new h4::after { content: 'new'; font-family: var(--f-body); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); margin-left: 8px; vertical-align: middle; }

/* relics */
.relics { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.relic { padding: 8px 10px; border: 1px dashed var(--line2); border-radius: 4px; font-size: 12.5px; color: var(--faint); }
.relic.got { border-style: solid; color: var(--muted); background: var(--card); }
.relic.got b { color: var(--ink); }
.relic b { display: block; font-size: 13px; }

/* modal + toasts */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; background: rgba(8, 6, 4, .66); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modal .box { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; max-width: 520px; width: 100%; padding: 22px 22px 18px; box-shadow: 0 30px 60px rgba(0,0,0,.5); max-height: 90vh; overflow-y: auto; }
#modal h2 { font-family: var(--f-display); font-weight: 400; margin: 0 0 8px; font-size: 26px; }
#modal p { margin: 0 0 12px; line-height: 1.6; }
#modal .row { justify-content: flex-end; margin-top: 14px; }
#toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 40; max-width: min(360px, calc(100vw - 28px)); pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--lamp); padding: 8px 12px; border-radius: 4px; font-size: 13px; box-shadow: var(--shadow); animation: tin .25s ease-out; }
.toast b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--lamp); }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
textarea { width: 100%; min-height: 90px; font-family: var(--f-mono); font-size: 11.5px; background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 4px; padding: 8px; }
select, input[type=text] { font: inherit; font-size: 13px; background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 5px; padding: 4px 8px; }
label.tg { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.addr { font-family: var(--f-mono); font-size: 12.5px; background: var(--card); border: 1px solid var(--line); padding: 10px 12px; border-radius: 4px; line-height: 1.7; word-break: break-all; }


/* ---------- story and horror ---------- */
#cine { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px 16px; cursor: pointer;
  background: radial-gradient(ellipse at 50% 45%, rgba(28, 21, 14, .94), rgba(4, 3, 2, .985) 70%); color: #eadcc1; animation: cfade .9s ease-out; }
#cine .cbox { max-width: 640px; width: 100%; text-align: center; }
#cine .ck { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: #b59a6a; }
#cine h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 6vw, 54px); margin: 10px 0 26px; line-height: 1.05; text-wrap: balance; }
#cine .cl p { font-size: clamp(16px, 2.2vw, 19px); line-height: 1.7; margin: 0 0 14px; opacity: 0; transform: translateY(8px); animation: cline 1.4s ease-out forwards; }
#cine .cbtn { margin-top: 12px; }
#cine .skip { margin-top: 18px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #7d6b52; }
#cine.horror { background: radial-gradient(ellipse at 50% 60%, rgba(70, 8, 8, .55), rgba(4, 2, 2, .985) 72%), #050303; }
#cine.horror h2 { color: #e08a72; text-shadow: 0 0 22px rgba(200, 40, 20, .45); animation: jitter 3.4s infinite; }
#cine.horror::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); animation: flick 5s infinite; }
#cine.h3 { background: radial-gradient(ellipse at 50% 60%, rgba(50, 20, 70, .5), rgba(4, 2, 5, .985) 72%), #040205; }
#cine.h5 { background: radial-gradient(ellipse at 50% 60%, rgba(10, 70, 60, .45), rgba(2, 4, 4, .985) 72%), #020404; }
#cine.h7 { background: radial-gradient(ellipse at 50% 50%, #fbf8ef, #e3dccb 75%); color: #221a12; }
#cine.h7 h2 { color: #111; text-shadow: none; } #cine.h7 .ck, #cine.h7 .skip { color: #7a6c58; }
@keyframes cfade { from { opacity: 0; } }
@keyframes cline { to { opacity: 1; transform: none; } }
@keyframes jitter { 0%, 90%, 100% { transform: none; } 91% { transform: translate(2px, -1px) skewX(5deg); } 93% { transform: translate(-3px, 1px); } 95% { transform: translate(1px, 0) skewX(-4deg); } }
@keyframes flick { 0%, 100% { opacity: .5; } 48% { opacity: .5; } 50% { opacity: .9; } 52% { opacity: .4; } }
#banner { position: absolute; left: 50%; top: 13%; transform: translate(-50%, -10px); z-index: 4; width: min(90%, 520px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .9s, transform .9s; color: #f3dca6; text-shadow: 0 2px 14px #000, 0 0 30px rgba(0,0,0,.8); }
#banner.show { opacity: 1; transform: translate(-50%, 0); }
#banner h3 { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); margin: 0; }
#banner p { margin: 4px 0 0; font-size: 14px; color: #e2cfa8; }
.float.dmg { color: #ff9f8a; }
#book[data-stage="4"] .pg, #book[data-stage="5"] .pg { filter: sepia(.25) contrast(1.04); }
#book[data-stage="6"] .pg { filter: sepia(.35) hue-rotate(-12deg) saturate(1.2); }
#book[data-stage="7"] .pg { filter: grayscale(.8) brightness(1.08); }
.rc.ink .v { color: var(--danger); }

@media (max-width: 900px) {
  #app { height: auto; }
  main { display: block; }
  #topRow { display: block; }
  #bookpane { padding: 14px 16px; border-right: none; border-bottom: 1px solid #000; }
  #stage { height: 330px; }
  #body { overflow: visible; padding-inline: 16px; }
  #top { padding-inline: 16px; }
  #clock { margin-left: 0; }
  .tier { grid-template-columns: 1fr; }
  .tier .buys { grid-row: auto; flex-wrap: wrap; }
  .tier .buys .btn { min-width: 0; flex: 1; }
  .item { grid-template-columns: 1fr; }
  .item .act { grid-row: auto; }
}
@media (max-width: 480px) {
  .pg { font-size: 9.5px; padding: 12px 9px 22px; min-height: 200px; }
  
  #res { gap: 4px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .loose, .float, .toast { animation: none !important; }
  .leaf { animation-duration: .01s !important; }
}

<script>
'use strict';
// ================= log10-space numbers =================
// Every large quantity is stored as its base-10 logarithm. Zero is -Infinity.
const Z = -Infinity;
const lg = x => (x > 0 ? Math.log10(x) : Z);
const pw = x => Math.pow(10, x);
function la(a, b) { // log(10^a + 10^b)
  if (a === Z) return b; if (b === Z) return a;
  if (a < b) { const t = a; a = b; b = t; }
  const d = b - a; if (d < -17) return a;
  return a + Math.log10(1 + Math.pow(10, d));
}
function ls(a, b) { // log(10^a - 10^b), clamps at zero
  if (b === Z) return a; if (b >= a) return Z;
  const d = b - a; if (d < -17) return a;
  return a + Math.log10(1 - Math.pow(10, d));
}
const L_BOOK = Math.log10(410);
const CHARS_PER_BOOK = 410 * 40 * 80;                 // 1,312,000
const L_TOTAL = CHARS_PER_BOOK * Math.log10(95);      // ≈ 2,594,768.4 : log10 of every book in the Library
const lg2 = Math.log10(2), lg3 = Math.log10(3), lg5 = Math.log10(5);
